name: Rust CI
on:
  push:
    branches: [main, master, refactor/rust-core]
    paths:
      - 'rust/**'
      - 'compatibility/**'
      - 'scripts/compatibility_inventory.py'
      - 'SPECIFICATION.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    branches: [main, master]
    paths:
      - 'rust/**'
      - 'compatibility/**'
      - 'scripts/compatibility_inventory.py'
      - 'SPECIFICATION.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
jobs:
  build:
    name: Build and test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Check Rust source files exist
        id: rust-check
        run: |
          if find rust -path '*/src/*.rs' -type f 2>/dev/null | grep -q .; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Rust crate source files (rust/**/src/**/*.rs) absent — Rust CI steps skipped (not applicable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Clippy
        if: steps.rust-check.outputs.skip != 'true'
        run: nix run .#clippy
      - name: Build all crates
        if: steps.rust-check.outputs.skip != 'true'
        run: nix run .#build-rust
      - name: Run tests
        if: steps.rust-check.outputs.skip != 'true'
        run: nix run .#cargo-test
