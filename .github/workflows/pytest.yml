name: Pytest

# Pytest runs under Nix with Python 3.14 + nixpkgs packages.
# Controller input is handled by Rust core; pygame is not required.

on:
  push:
    branches: [main, master, refactor/rust-core]
  pull_request:
    branches: [main, master]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check test files exist
        id: pytest-check
        run: |
          if [ -d tests ] && find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null | grep -q .; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Collectable pytest modules (tests/test_*.py or tests/*_test.py) absent — pytest skipped (not applicable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run pytest
        if: steps.pytest-check.outputs.skip != 'true'
        run: nix run .#test
