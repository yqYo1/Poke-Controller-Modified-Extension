<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>オフライン — Poke-Controller</title>
  <meta name="theme-color" content="#1a1a2e" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 128px;
      height: 128px;
      margin-bottom: 2rem;
      opacity: 0.6;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #e94560;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      max-width: 320px;
      color: #a0a0b0;
    }
    .retry-btn {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      border: 2px solid #e94560;
      background: transparent;
      color: #e94560;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .retry-btn:hover {
      background: #e94560;
      color: #fff;
    }
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="256" cy="256" r="240" fill="none" stroke="#e94560" stroke-width="16"/>
    <rect x="96" y="176" width="320" height="160" rx="32" fill="#e94560"/>
    <rect x="64" y="208" width="48" height="96" rx="16" fill="#e94560"/>
    <rect x="400" y="208" width="48" height="96" rx="16" fill="#e94560"/>
    <rect x="156" y="232" width="16" height="48" rx="4" fill="#1a1a2e"/>
    <rect x="148" y="240" width="32" height="16" rx="4" fill="#1a1a2e"/>
    <circle cx="356" cy="248" r="10" fill="#1a1a2e"/>
    <circle cx="376" cy="256" r="10" fill="#1a1a2e"/>
    <circle cx="356" cy="268" r="10" fill="#1a1a2e"/>
    <circle cx="340" cy="256" r="10" fill="#1a1a2e"/>
  </svg>
  <h1>オフライン</h1>
  <p>ネットワークに接続できません。<br />再接続してからもう一度お試しください。</p>
  <button class="retry-btn" onclick="location.reload()">再試行</button>
</body>
</html>
