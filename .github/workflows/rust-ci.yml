name: Rust CI
on:
  push:
    branches: [main, master, refactor/rust-core]
    paths:
      - 'rust/**'
      - 'web/**'
      - 'compatibility/**'
      - 'scripts/integration/**'
      - 'scripts/compatibility/**'
      - 'scripts/quality/**'
      - 'tests/fixtures/cli-help/**'
      - 'SPECIFICATION.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/compatibility-roll.yml'
  pull_request:
    branches: [main, master, refactor/rust-core]
    paths:
      - 'rust/**'
      - 'web/**'
      - 'compatibility/**'
      - 'scripts/integration/**'
      - 'scripts/compatibility/**'
      - 'scripts/quality/**'
      - 'tests/fixtures/cli-help/**'
      - 'SPECIFICATION.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/compatibility-roll.yml'
jobs:
  build:
    name: Build and test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Rust source guard
        id: rust-check
        run: nix run .#source-guard -- rust --github-output "$GITHUB_OUTPUT"
      - name: Clippy, build, test, and compatibility
        if: steps.rust-check.outputs.applicable == 'true'
        run: nix run .#rust-ci-core

  package:
    name: Verify immutable packages (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Rust source guard
        id: rust-check
        run: nix run .#source-guard -- rust --github-output "$GITHUB_OUTPUT"
      - name: Verify packaged worker roles
        if: steps.rust-check.outputs.applicable == 'true'
        run: nix run .#worker-package-check
      - name: Verify immutable Web and Tauri modes
        run: nix run .#ui-package-check
      - name: Verify packaged CLI help
        run: nix run .#cli-help-check

  build-windows:
    name: Check workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95.0'
      - name: Check all Windows targets and features
        env:
          POKECON_RESOURCE_PROVENANCE: development
        run: cargo check --locked --workspace --all-targets --all-features
