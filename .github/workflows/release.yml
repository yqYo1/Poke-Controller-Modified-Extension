name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux package and Tauri bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release identity
        run: nix run .#release-check -- --tag "$GITHUB_REF_NAME"
      - name: Run complete release gate
        run: nix run .#check
      - name: Build Linux Nix package
        run: nix build .#pokecon --out-link result-pokecon
      - name: Build Linux Tauri package
        run: nix run .#tauri-build -- --bundles deb
      - name: Audit packaged runtime and offline wheelhouse
        run: nix run .#package-smoke -- dist/tauri/*.deb
      - name: Verify clean install, offline startup, upgrade, and uninstall
        run: nix run .#package-install-smoke -- dist/tauri/*.deb
      - name: Preserve first Linux package build
        run: cp dist/tauri/*.deb "$RUNNER_TEMP/pokecon-first.deb"
      - name: Rebuild Linux package from identical inputs
        run: nix run .#tauri-build -- --bundles deb
      - name: Record Linux signing inputs
        run: >-
          nix run .#signing-input-manifest --
          --platform linux
          --bundle dist/tauri/*.deb
          --output dist/tauri/signing-inputs.json
      - name: Verify byte-for-byte Linux package reproducibility
        run: cmp "$RUNNER_TEMP/pokecon-first.deb" dist/tauri/*.deb
      - name: Create portable and offline Nix artifacts
        run: |
          mkdir -p dist
          mv dist/tauri/*.deb dist/
          mv \
            dist/tauri/signing-inputs.json \
            dist/signing-inputs-linux-x86_64.json
          tar \
            --dereference \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C result-pokecon \
            -czf "dist/pokecon-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            .
          mapfile -t closure_paths < <(nix-store -qR result-pokecon)
          nix-store --export "${closure_paths[@]}" \
            | zstd -19 -T0 \
            > "dist/pokecon-${GITHUB_REF_NAME}-linux-x86_64.nar.zst"
      - name: Verify Linux signing inputs at handoff
        run: >-
          nix run .#signing-input-manifest --
          --platform linux
          --bundle dist/*.deb
          --verify dist/signing-inputs-linux-x86_64.json
      - name: Generate Linux checksums
        run: >-
          nix run .#release-check --
          --tag "$GITHUB_REF_NAME"
          --artifacts dist
          --checksums dist/SHA256SUMS-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95.0'
      - name: Install pinned release tools
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nasm -y --no-progress
          python -m pip install --disable-pip-version-check "uv==0.11.8"
          cargo install tauri-cli --version 2.11.4 --locked
          vcpkg install portaudio:x64-windows-static
      - name: Export release tool identity
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $uv = (Get-Command uv).Source
          $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
          "POKECON_BUILD_UV_PATH=$uv" | Out-File -FilePath $env:GITHUB_ENV -Append
          "POKECON_BUILD_UV_VERSION=0.11.8" | Out-File -FilePath $env:GITHUB_ENV -Append
          "POKECON_INTERNAL_SCRIPT_SITE_PACKAGES=$sitePackages" | Out-File -FilePath $env:GITHUB_ENV -Append
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])"
          "POKECON_WEB_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SOURCE_DATE_EPOCH=0" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Validate release identity
        shell: pwsh
        run: python -m scripts.release.gate --tag $env:GITHUB_REF_NAME
      - name: Build Web distribution
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --cwd web --frozen-lockfile --ignore-scripts --no-progress
          bun run --cwd web --bun lint
          bun run --cwd web --bun svelte-check
          bun run --cwd web --bun test
          bun run --cwd web --bun build
      - name: Build and stage managed runtimes
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:POKECON_RESOURCE_PROVENANCE = $null
          $env:PYTHONDONTWRITEBYTECODE = "1"
          "PYTHONDONTWRITEBYTECODE=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          $uv = (Get-Command uv).Source
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows-static"
          $releaseRoot = Join-Path $env:RUNNER_TEMP "pokecon-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $releasePython = Join-Path $releaseRoot "python"
          $releaseWheelhouse = Join-Path $releaseRoot "wheelhouse"
          $bundleResources = Join-Path $releaseRoot "bundle-resources"
          $bundleConfig = Join-Path $releaseRoot "tauri.bundle.json"
          python -m scripts.release.build_runtime `
            --project . `
            --uv $uv `
            --runtime-output $releasePython `
            --wheelhouse-output $releaseWheelhouse `
            --vcpkg-path $vcpkg
          $runtimePython = (Resolve-Path (Join-Path $releasePython "python.exe")).Path
          "PYO3_PYTHON=$runtimePython" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:PYO3_PYTHON = $runtimePython
          $env:POKECON_RESOURCE_PROVENANCE = "development"
          cargo build --locked --release --package pokecon --bin pokecon-worker --features worker-binary
          $env:POKECON_RESOURCE_PROVENANCE = $null
          $stageJson = python -m scripts.release.stage `
            --web web/dist `
            --worker target/release/pokecon-worker.exe `
            --uv $uv `
            --wheelhouse $releaseWheelhouse `
            --python $releasePython `
            --output $bundleResources `
            --config-output $bundleConfig
          $stageReport = $stageJson | ConvertFrom-Json -ErrorAction Stop
          $contentSha256 = $stageReport.content_sha256
          if ($contentSha256 -isnot [string] -or $contentSha256 -cnotmatch '\A[0-9a-f]{64}\z') {
            throw "release stage content_sha256 must be an exact lowercase SHA-256 digest"
          }
          "POKECON_RESOURCE_PROVENANCE=packaged:$contentSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "POKECON_BUNDLE_CONFIG=$bundleConfig" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build offline NSIS installer
        shell: pwsh
        working-directory: rust/pokecon
        run: >-
          cargo tauri build --ci --bundles nsis
          --config $env:POKECON_BUNDLE_CONFIG
          -- --locked
      - name: Preserve first Windows package build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = (Get-ChildItem target/release/bundle/nsis/*.exe -File).FullName
          $first = Join-Path $env:RUNNER_TEMP "pokecon-first.exe"
          Copy-Item $installer $first -Force
          $sha256 = (Get-FileHash $first -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $first).Length
          Write-Host "Preserved first Windows installer: $first (sha256=$sha256, size=$size)"
      - name: Rebuild Windows package from identical inputs
        shell: pwsh
        working-directory: rust/pokecon
        run: >-
          cargo tauri build --ci --bundles nsis
          --config $env:POKECON_BUNDLE_CONFIG
          -- --locked
      - name: Verify byte-for-byte Windows NSIS reproducibility
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $first = Join-Path $env:RUNNER_TEMP "pokecon-first.exe"
          $second = (Get-ChildItem target/release/bundle/nsis/*.exe -File).FullName
          if (-not (Test-Path $first)) { throw "first Windows installer not preserved: $first" }
          if (-not (Test-Path $second)) { throw "second Windows installer missing: $second" }
          $firstSha256 = (Get-FileHash $first -Algorithm SHA256).Hash.ToLower()
          $secondSha256 = (Get-FileHash $second -Algorithm SHA256).Hash.ToLower()
          $firstSize = (Get-Item $first).Length
          $secondSize = (Get-Item $second).Length
          Write-Host "first:  $firstSha256 ($firstSize bytes) $first"
          Write-Host "second: $secondSha256 ($secondSize bytes) $second"
          if ($firstSha256 -ne $secondSha256) { throw "Windows NSIS reproducibility failed: SHA256 mismatch ($firstSha256 != $secondSha256)" }
          if ($firstSize -ne $secondSize) { throw "Windows NSIS reproducibility failed: size mismatch ($firstSize != $secondSize)" }
          $firstBytes = [System.IO.File]::ReadAllBytes($first)
          $secondBytes = [System.IO.File]::ReadAllBytes($second)
          if ($firstBytes.Length -ne $secondBytes.Length) { throw "Windows NSIS reproducibility failed: ReadAllBytes length mismatch" }
          if (-not [System.Linq.Enumerable]::SequenceEqual($firstBytes, $secondBytes)) { throw "Windows NSIS reproducibility failed: ReadAllBytes byte mismatch" }
          $fcOutput = & fc.exe /b $first $second 2>&1
          $fcExit = $LASTEXITCODE
          $fcOutput | ForEach-Object { Write-Host $_ }
          if ($fcExit -ne 0) { throw "Windows NSIS reproducibility failed: fc.exe /b reported differences (exit $fcExit)" }
          if ($fcOutput -notmatch "FC: no differences encountered") { Write-Host "fc.exe /b output did not contain no-differences phrase, but exit was 0; continuing" }
          Write-Host "Windows NSIS byte-for-byte reproducibility verified"
      - name: Record Windows signing inputs
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = (Get-ChildItem target/release/bundle/nsis/*.exe -File).FullName
          python -m scripts.release.signing_manifest `
            --platform windows `
            --bundle $installer `
            --output target/release/bundle/nsis/signing-inputs.json
      - name: Verify clean install, startup, upgrade, and uninstall
        shell: pwsh
        run: >-
          ./scripts/release/windows_install_smoke.ps1
          -Installer (Get-ChildItem target/release/bundle/nsis/*.exe -File).FullName
      - name: Collect installer and checksums
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Copy-Item `
            target/release/bundle/nsis/signing-inputs.json `
            dist/signing-inputs-windows-x86_64.json
          $installer = (Get-ChildItem dist/*-setup.exe -File).FullName
          python -m scripts.release.signing_manifest `
            --platform windows `
            --bundle $installer `
            --verify dist/signing-inputs-windows-x86_64.json
          python -m scripts.release.gate `
            --tag $env:GITHUB_REF_NAME `
            --artifacts dist `
            --checksums dist/SHA256SUMS-windows-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate complete checksum manifest
        run: >-
          nix run .#release-check --
          --tag "$GITHUB_REF_NAME"
          --artifacts release-assets
          --checksums release-assets/SHA256SUMS
      - name: Publish immutable release assets
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Installation, upgrade, offline, and migration instructions are in `docs/`.
            Verify every downloaded artifact against `SHA256SUMS` before use.
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release-assets/*
