[package]
name = "pokecon-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
homepage = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
description = "HTTP/WebSocket/WebRTC server for Poke-Controller"

# Exclude from workspace — built independently
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio-serial = "5.4"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
base64 = "0.22"
url = "2"
futures = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }
str0m = "0.19"
rand = "0.8"

# FFmpeg for VAAPI hardware encoding (Linux only, optional)
ffmpeg-next = { version = "8.1", optional = true }
ffmpeg-sys-next = { version = "8.1", optional = true }
thiserror = { version = "2", optional = true }

# Workspace crates
pokecon-core = { path = "../rust/pokecon-core", features = ["utoipa"] }
mime_guess = "2.0.5"
tower = "0.5.3"

[features]
default = ["notify", "v4l"]
vaapi = ["dep:ffmpeg-next", "dep:ffmpeg-sys-next", "dep:thiserror"]
v4l = ["pokecon-core/v4l"]
notify = ["pokecon-core/notify"]
mqtt = ["pokecon-core/mqtt"]
lua = ["pokecon-core/lua"]
