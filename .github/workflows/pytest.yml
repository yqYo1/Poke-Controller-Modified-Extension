name: Pytest

# Pytest runs under Nix with Python 3.14 + nixpkgs packages.
# Controller input is handled by Rust core; pygame is not required.

on:
  push:
    branches: [main, master, refactor/rust-core]
  pull_request:
    branches: [main, master]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run pytest
        run: nix run .#test
