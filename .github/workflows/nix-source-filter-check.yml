name: Nix Source Filter Check

on:
  push:
    branches: [main, master, refactor/rust-core]
  pull_request:
    branches: [main, master, refactor/rust-core]

jobs:
  check-source-filter:
    name: Verify Nix source filter coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare build-source extensions with flake.nix
        run: nix run .#source-filter-check
