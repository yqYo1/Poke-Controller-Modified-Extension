name: Remote Flake Test

# Tests that the flake can be executed remotely without cloning.
# This verifies that all paths in flake.nix use nix store references
# rather than local file system paths.

on:
  push:
    branches: [main, master, refactor/rust-core]
  pull_request:
    branches: [main, master, refactor/rust-core]

jobs:
  remote-flake-run:
    name: Run flake from remote (no clone)
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run default app from remote
        run: |
          # Test that the default app can be built from remote
          # This will fail if the flake references local paths
          nix run --refresh github:yqYo1/Poke-Controller-Modified-Extension/${{ github.sha }} -- --help
      - name: Run check app from remote
        run: |
          nix run --refresh github:yqYo1/Poke-Controller-Modified-Extension/${{ github.sha }}#check -- --help || true

  local-flake-run:
    name: Run flake from local checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run default app locally
        run: |
          nix run . -- --help
      - name: Run check app locally
        run: |
          nix run .#check -- --help || true
      - name: Evaluate flake
        run: |
          nix flake check --no-build
