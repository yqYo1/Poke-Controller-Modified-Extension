name: Basedpyright

on:
  push:
    branches: [main, master, refactor/rust-core]
  pull_request:
    branches: [main, master]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate Python source guard
        id: py-check
        run: nix run .#source-guard -- python --github-output "$GITHUB_OUTPUT"

      - name: Run Basedpyright
        if: steps.py-check.outputs.applicable == 'true'
        run: nix run .#basedpyright
