name: Rust CI
on:
  push:
    branches: [main, master, refactor/rust-core]
    paths:
      - 'rust/**'
      - 'compatibility/**'
      - 'scripts/compatibility/**'
      - 'scripts/quality/**'
      - 'SPECIFICATION.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/compatibility-roll.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'rust/**'
      - 'compatibility/**'
      - 'scripts/compatibility/**'
      - 'scripts/quality/**'
      - 'SPECIFICATION.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/compatibility-roll.yml'
jobs:
  build:
    name: Build and test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Evaluate Rust source guard
        id: rust-check
        run: nix run .#source-guard -- rust --github-output "$GITHUB_OUTPUT"
      - name: Clippy
        if: steps.rust-check.outputs.applicable == 'true'
        run: nix run .#clippy
      - name: Build all crates
        if: steps.rust-check.outputs.applicable == 'true'
        run: nix run .#build-rust
      - name: Run tests
        if: steps.rust-check.outputs.applicable == 'true'
        run: nix run .#cargo-test
      - name: Verify packaged worker roles
        if: steps.rust-check.outputs.applicable == 'true'
        run: nix run .#worker-package-check
      - name: Execute immutable compatibility corpus
        if: steps.rust-check.outputs.applicable == 'true'
        run: nix run .#compatibility

  build-windows:
    name: Build workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95.0'
      - name: Check all Windows targets and features
        run: cargo check --locked --workspace --all-targets --all-features
