[workspace]
resolver = "2"
members = [
    "rust/pokecon-core",
    "rust/pokecon-pybindings",
    # "src-server",  # Server app — built separately via nix run .#tauri-build
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["yqYo1"]
repository = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
homepage = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
keywords = ["pokemon", "automation", "switch", "3ds", "controller", "serial"]
categories = ["games", "hardware-support", "embedded"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
pyo3 = { version = "0.25", features = ["extension-module", "py-clone"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "async"] }
toml = "0.8"

