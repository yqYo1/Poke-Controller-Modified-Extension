name: Lint

on:
  push:
    branches: [main, master, refactor/rust-core]
  pull_request:
    branches: [main, master]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate canonical contracts and specification drift
        run: nix run .#contract-check

  nix-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting with treefmt
        run: nix fmt -- --ci

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Rust source files exist
        id: rust-check
        run: |
          if find rust -path '*/src/*.rs' -type f 2>/dev/null | grep -q .; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Rust crate source files (rust/**/src/**/*.rs) absent — rust-lint skipped (not applicable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run cargo clippy
        if: steps.rust-check.outputs.skip != 'true'
        run: nix run .#clippy

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ruff check
        run: nix run .#ruff-check
      - name: Run ruff format check
        run: nix run .#ruff-format-check

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check typos
        run: nix run .#typos

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check web source files exist
        id: web-check-guard
        run: |
          if [ -f web/package.json ] && [ -f web/package-lock.json ] && \
             find web/src -type f \( -name '*.svelte' -o -name '*.ts' -o -name '*.js' -o -name '*.tsx' -o -name '*.jsx' \) 2>/dev/null | grep -q .; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Web source files (web/package.json + web/package-lock.json + web/src/**/*.{svelte,ts,js,tsx,jsx}) absent — web-check skipped (not applicable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run web checks (eslint + svelte-check + vitest)
        if: steps.web-check-guard.outputs.skip != 'true'
        run: nix run .#web-check

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check markdown with markdownlint
        run: nix run .#markdownlint-check

  textlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check text with textlint
        run: nix run .#textlint-check
