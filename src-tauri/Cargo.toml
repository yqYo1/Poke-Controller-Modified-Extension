[package]
name = "pokecon-tauri"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
homepage = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
description = "Tauri v2 native desktop UI for Poke-Controller"

# Exclude from workspace — built independently
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio-serial = "5.4"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
base64 = "0.22"
url = "2"
futures = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }
str0m = "0.19"
rand = "0.8"

# Workspace crates
pokecon-core = { path = "../rust/pokecon-core" }
pokecon-events = { path = "../rust/pokecon-events" }
pokecon-serial = { path = "../rust/pokecon-serial" }
pokecon-cv = { path = "../rust/pokecon-cv" }
pokecon-notify = { path = "../rust/pokecon-notify" }

[features]
default = []
v4l = ["pokecon-cv/v4l"]
