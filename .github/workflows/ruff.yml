name: Ruff Check
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Python source files exist
        id: py-check
        run: |
          if find . -type d -name node_modules -prune -o -name '*.py' -type f -print 2>/dev/null | grep -q .; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Python source files (.py) found — ruff skipped (not applicable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ruff check
        if: steps.py-check.outputs.skip != 'true'
        run: nix run .#ruff-check
      - name: Run ruff format check
        if: steps.py-check.outputs.skip != 'true'
        run: nix run .#ruff-format-check
