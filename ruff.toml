include = [
  "SerialController/**/*.py",
  "python/**/*.py",
  "python/**/*.pyi",
  "scripts/**/*.py",
  "tests/**/*.py",
  "tests/**/*.pyi",
]
# Same as Black.
line-length = 88
indent-width = 4
target-version = "py314"

[lint]
select = [
  "ANN",  # flake8-annotations
  "S",  # flake8-bandit
  "B",  # flake8-bugbear
  "A",  # flake8-builtins
  "COM",  # flake8-commas
  "EM",  # flake8-errmsg
  "EXE",  # flake8-executable
  "FA",  # flake8-future-annotations
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "G",  # flake8-logging-format
  "PIE",  # flake8-pie
  "Q",  # flake8-quotes
  "RSE",  # flake8-raise
  "RET",  # flake8-return
  "SLF",  # flake8-self
  "SIM",  # flake8-simplify
  "TC",  # flake8-type-checking
  "ARG",  # flake8-unused-arguments
  "FLY",  # flynt
  "I",  # isort
  "NPY",  # NumPy-specific rules
  "PERF",  # Perflint
  "E",  # pycodestyle Error
  "W",  # pycodestyle Warning
  "F",  # Pyflakes
  "PGH",  # pygrep-hooks
  "PL",  # Pylint
  "UP",  # pyupgrade
  "RUF",  # Ruff-specific rules
]
ignore = [
  "UP009",
  "S107",
  "G004",
  "COM812",  # formatterと競合する末尾カンマ規則
  "E501",  # formatはline-lengthを越える事がある
  "E731",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "S311",
]
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"scripts/compatibility_inventory.py" = [
  "EM101",  # 検証失敗の動的な文脈を例外メッセージへ保持する
  "EM102",
  "S603",  # 引数配列で固定git実行ファイルを呼ぶ互換コーパス取得器
  "S607",
]
"scripts/build_release_runtime.py" = [
  "S603",  # release tool paths are explicit CLI/Nix inputs and never shell-expanded
]
"scripts/normalize_linux_elf.py" = [
  "S603",  # release tool paths are explicit CLI/Nix inputs and never shell-expanded
]
"scripts/normalize_debian_package.py" = [
  "S603",  # dpkg-deb is an explicit resolved CLI/Nix input and is never shell-expanded
]
"scripts/package_smoke.py" = [
  "S603",  # package/tool paths are explicit CLI/Nix inputs and never shell-expanded
]
"tests/**/*.py" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
