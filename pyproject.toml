[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[project]
name = "poke-controller-modified-extension"
version = "0.1.0"
description = "Poke-Controller Modified Extension - Game console automation software with Rust core, Python scripting, camera capture, and MQTT notifications"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "yqYo1" }]
keywords = ["pokemon", "automation", "switch", "3ds", "controller"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
torch = [
  "torch>=2.8.0",
  "torchvision>=0.23.0",
]
keyboard = [
    "pykakasi>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
Repository = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
Documentation = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"

[dependency-groups]
worker-script = [
  "icecream>=2.1.4",
  "loguru>=0.7.3",
  "numpy>=2.2.6",
  "opencv-python>=4.12.0.88",
  "pandas>=2.3.1",
  "pillow>=11.3.0",
  "pyaudio==0.2.14",
  "pygubu>=0.38.2",
  "pynput>=1.8.1",
  "pyserial>=3.5",
  "pythonnet>=3.0.5",
  "requests>=2.32.4",
  "scipy>=1.16.1",
]
worker-dynamic = []
dev = [
  "basedpyright>=1.31.4",
  "pytest>=8.4.0",
  "ruff>=0.12.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "production_routing_audit: baseline fail-closed routing audit run by its dedicated Nix gate",
    "production_routing_mutation: exhaustive fail-closed mutation audit run by its dedicated Nix gate",
]

[tool.uv.build-backend]
module-name = "pokecon"
module-root = "python"
