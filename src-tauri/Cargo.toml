[package]
name = "pokecon-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tauri v2 native desktop UI for Poke-Controller"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Workspace crates
pokecon-core = { path = "../rust/pokecon-core" }
pokecon-events = { path = "../rust/pokecon-events" }
pokecon-serial = { path = "../rust/pokecon-serial" }
pokecon-cv = { path = "../rust/pokecon-cv" }
