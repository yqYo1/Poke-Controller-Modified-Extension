name: Ruff Check
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v2
        with:
          version: "latest"
          args: "check --select E,W,F --ignore E402,E501,E722,E741,F821,F841"
      - uses: astral-sh/ruff-action@v2
        with:
          version: "latest"
          args: "format --check --diff"
