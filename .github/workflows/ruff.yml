name: Ruff Check
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Python lint source guard
        id: py-check
        run: nix run .#source-guard -- python-lint --github-output "$GITHUB_OUTPUT"
      - name: Run ruff check
        if: steps.py-check.outputs.applicable == 'true'
        run: nix run .#ruff-check
      - name: Run ruff format check
        if: steps.py-check.outputs.applicable == 'true'
        run: nix run .#ruff-format-check
