name: Pytest

# Pytest runs under Nix with Python 3.14 + nixpkgs packages.
# Controller input is handled by Rust core; pygame is not required.

on:
  push:
    branches: [main, master, refactor/rust-core]
  pull_request:
    branches: [main, master]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate pytest source guard
        id: pytest-check
        run: nix run .#source-guard -- pytest --github-output "$GITHUB_OUTPUT"
      - name: Run pytest
        if: steps.pytest-check.outputs.applicable == 'true'
        run: nix run .#test

  production-routing-mutation-audit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate pytest source guard
        id: pytest-check
        run: nix run .#source-guard -- pytest --github-output "$GITHUB_OUTPUT"
      - name: Run production-routing mutation audit
        if: steps.pytest-check.outputs.applicable == 'true'
        run: nix run .#test-production-routing-mutations
