name: Package CI

on:
  push:
    branches: [main, master, refactor/rust-core]
    paths:
      - '.github/workflows/package.yml'
      - '.github/workflows/release.yml'
      - 'rust/**'
      - 'web/**'
      - 'python/**'
      - 'scripts/build_release_runtime.py'
      - 'scripts/debian_container_smoke.sh'
      - 'scripts/debian_install_smoke.sh'
      - 'scripts/normalize_debian_package.py'
      - 'scripts/normalize_linux_elf.py'
      - 'scripts/package_smoke.py'
      - 'scripts/stage_release.py'
      - 'scripts/windows_install_smoke.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/package.yml'
      - '.github/workflows/release.yml'
      - 'rust/**'
      - 'web/**'
      - 'python/**'
      - 'scripts/build_release_runtime.py'
      - 'scripts/debian_container_smoke.sh'
      - 'scripts/debian_install_smoke.sh'
      - 'scripts/normalize_debian_package.py'
      - 'scripts/normalize_linux_elf.py'
      - 'scripts/package_smoke.py'
      - 'scripts/stage_release.py'
      - 'scripts/windows_install_smoke.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'flake.nix'
      - 'flake.lock'

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Debian bundle and clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Debian package
        run: nix run .#tauri-build -- --bundles deb
      - name: Audit packaged runtime and offline wheelhouse
        run: nix run .#package-smoke -- dist/tauri/*.deb
      - name: Verify clean install, offline startup, upgrade, and uninstall
        run: nix run .#package-install-smoke -- dist/tauri/*.deb
      - name: Preserve first package build
        run: cp dist/tauri/*.deb "$RUNNER_TEMP/pokecon-first.deb"
      - name: Rebuild Debian package from identical inputs
        run: nix run .#tauri-build -- --bundles deb
      - name: Verify byte-for-byte package reproducibility
        run: |
          cmp "$RUNNER_TEMP/pokecon-first.deb" dist/tauri/*.deb
          sha256sum dist/tauri/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-x86_64
          path: dist/tauri/*.deb
          if-no-files-found: error
          retention-days: 3

  windows:
    name: NSIS bundle and clean-install smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95.0'
      - name: Install pinned package tools
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          python -m pip install --disable-pip-version-check "uv==0.11.8"
          cargo install tauri-cli --version 2.9.6 --locked
          vcpkg install portaudio:x64-windows-static
      - name: Export package tool identity
        shell: pwsh
        run: |
          $uv = (Get-Command uv).Source
          $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])"
          "POKECON_BUILD_UV_PATH=$uv" | Out-File -FilePath $env:GITHUB_ENV -Append
          "POKECON_BUILD_UV_VERSION=0.11.8" | Out-File -FilePath $env:GITHUB_ENV -Append
          "POKECON_INTERNAL_SCRIPT_SITE_PACKAGES=$sitePackages" | Out-File -FilePath $env:GITHUB_ENV -Append
          "POKECON_WEB_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SOURCE_DATE_EPOCH=0" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build Web distribution
        shell: pwsh
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
      - name: Build and stage managed runtimes
        shell: pwsh
        run: |
          $uv = (Get-Command uv).Source
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows-static"
          python -m scripts.build_release_runtime `
            --project . `
            --uv $uv `
            --runtime-output target/release-python `
            --wheelhouse-output target/release-wheelhouse `
            --vcpkg-path $vcpkg
          $runtimePython = (Resolve-Path target/release-python/python.exe).Path
          "PYO3_PYTHON=$runtimePython" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:PYO3_PYTHON = $runtimePython
          cargo build --locked --release --package pokecon-worker --bin pokecon-worker
          python -m scripts.stage_release `
            --web web/dist `
            --worker target/release/pokecon-worker.exe `
            --uv $uv `
            --wheelhouse target/release-wheelhouse `
            --python target/release-python `
            --output target/bundle-resources `
            --config-output target/tauri.bundle.json
      - name: Build offline NSIS installer
        shell: pwsh
        working-directory: rust/pokecon-app
        run: >-
          cargo tauri build --ci --bundles nsis
          --config ../../target/tauri.bundle.json
          -- --locked
      - name: Verify clean install, startup, upgrade, and uninstall
        shell: pwsh
        run: >-
          ./scripts/windows_install_smoke.ps1
          -Installer (Get-ChildItem target/release/bundle/nsis/*.exe -File).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows-x86_64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
