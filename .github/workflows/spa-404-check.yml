name: SPA 404 Check

# Detects the SPA 404 issue where the UI shows "404 Not Found" but HTTP status is 200.
# This happens when source files (e.g., .svelte) are missing from the nix build,
# causing SvelteKit to build only the fallback error page.
#
# The workflow:
# 1. Builds the project via nix
# 2. Starts the server in web mode (no GUI needed)
# 3. Requests the UI endpoint
# 4. Fails if the response body contains "404" or "Not Found"

on:
  push:
    branches: [main, master, refactor/rust-core]
  pull_request:
    branches: [main, master, refactor/rust-core]

jobs:
  spa-404-check:
    name: Check SPA for 404 error page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate complete SPA source guard
        id: source-check
        run: nix run .#source-guard -- spa --github-output "$GITHUB_OUTPUT"

      - name: Build and start server
        id: server
        if: steps.source-check.outputs.applicable == 'true'
        run: |
          # Build the application package (phase 11 adds bundled web assets)
          nix build .#pokecon --out-link result-server

          # Start server in background with web UI mode
          # Use --ui web to avoid Tauri/GUI dependencies
          ./result-server/bin/pokecon \
            --ui web \
            --port 8080 &

          SERVER_PID=$!
          echo "server_pid=$SERVER_PID" >> "$GITHUB_OUTPUT"

          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ui/ > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "FAIL: Server did not start within 30 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Check UI response for 404 content
        if: steps.source-check.outputs.applicable == 'true'
        run: |
          # Fetch the UI page
          RESPONSE=$(curl -sf http://localhost:8080/ui/)

          # Check HTTP status (should be 200)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ui/)
          echo "HTTP Status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Expected HTTP 200, got $STATUS"
            exit 1
          fi

          # Check if response contains 404 error indicators
          # SvelteKit's built-in error page contains "404" and "Not Found"
          if echo "$RESPONSE" | grep -qi "404"; then
            echo "❌ FAIL: Response contains '404' - SvelteKit error page detected"
            echo "This indicates source files are missing from the nix build."
            echo ""
            echo "Response preview (first 500 chars):"
            echo "$RESPONSE" | head -c 500
            exit 1
          fi

          if echo "$RESPONSE" | grep -qi "Not Found"; then
            echo "❌ FAIL: Response contains 'Not Found' - SvelteKit error page detected"
            echo "This indicates source files are missing from the nix build."
            echo ""
            echo "Response preview (first 500 chars):"
            echo "$RESPONSE" | head -c 500
            exit 1
          fi

          echo "✅ UI response looks healthy (no 404/Not Found detected)"

      - name: Check key UI assets exist
        if: steps.source-check.outputs.applicable == 'true'
        run: |
          # Verify that the built index.html contains actual app content
          # not just the SvelteKit error page
          INDEX_HTML="./result-server/web/dist/index.html"

          if [ ! -f "$INDEX_HTML" ]; then
            echo "FAIL: index.html not found at $INDEX_HTML"
            exit 1
          fi

          # Check file size - error page is typically very small (~2KB)
          # Real app should be larger
          SIZE=$(stat -c%s "$INDEX_HTML")
          echo "index.html size: $SIZE bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo "⚠️  WARNING: index.html is suspiciously small ($SIZE bytes)"
            echo "This may indicate a minimal error page instead of the full app"
          fi

          # Count JS/CSS chunks - error page has very few
          JS_COUNT=$(find ./result-server/web/dist -name "*.js" | wc -l)
          CSS_COUNT=$(find ./result-server/web/dist -name "*.css" | wc -l)
          echo "JS files: $JS_COUNT"
          echo "CSS files: $CSS_COUNT"

          if [ "$JS_COUNT" -lt 5 ]; then
            echo "⚠️  WARNING: Very few JS files ($JS_COUNT) - may indicate incomplete build"
          fi

          echo "✅ Asset checks passed"

      - name: Cleanup server
        if: always() && steps.source-check.outputs.applicable == 'true'
        run: |
          if [ -n "${{ steps.server.outputs.server_pid }}" ]; then
            kill "${{ steps.server.outputs.server_pid }}" 2>/dev/null || true
          fi
