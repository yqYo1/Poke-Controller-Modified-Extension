name: Rust CI
on:
  push:
    branches: [main, master, refactor/rust-core]
    paths:
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    branches: [main, master]
    paths:
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
jobs:
  build:
    name: Build and test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Clippy
        run: nix run .#clippy
      - name: Build all crates
        run: nix run .#build-rust
      - name: Run tests
        run: |
          # GitHub Actions doesn't support bwrap (AppArmor restriction)
          # Use cargo test directly with libclang from nix
          export LIBCLANG_PATH="$(nix build --no-link --print-out-paths .#packages.x86_64-linux.libclang 2>/dev/null || echo /nix/store/*-clang-*/lib)/lib"
          nix develop --command cargo test --workspace --all-features --exclude pokecon-pybindings
