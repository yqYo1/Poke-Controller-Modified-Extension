[workspace]
resolver = "2"
members = [
    "rust/pokecon-app",
    "rust/pokecon-contracts",
    "rust/pokecon-core",
    "rust/pokecon-desktop",
    "rust/pokecon-pybindings",
    "rust/pokecon-server",
    "rust/pokecon-settings",
    "rust/pokecon-worker",
]
default-members = [
    "rust/pokecon-app",
    "rust/pokecon-contracts",
    "rust/pokecon-core",
    "rust/pokecon-desktop",
    "rust/pokecon-server",
    "rust/pokecon-settings",
    "rust/pokecon-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["yqYo1"]
repository = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
homepage = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
keywords = ["pokemon", "automation", "switch", "3ds", "controller", "serial"]
categories = ["games", "hardware-support", "embedded"]

[workspace.dependencies]
axum = "0.8.9"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
atomic-write-file = "0.3"
chrono = { version = "0.4", features = ["serde"] }
fs4 = "1"
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
parking_lot = "0.12"
pep440_rs = { version = "0.7", features = ["version-ranges"] }
pyo3 = { version = "0.29", features = ["abi3-py314", "extension-module"] }
tauri = { version = "2.11.5", default-features = false }
mlua = { version = "0.10", features = ["lua54", "vendored", "async"] }
nix = { version = "0.30", features = ["process", "signal"] }
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
regex = "1"
rmp-serde = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
version-ranges = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
