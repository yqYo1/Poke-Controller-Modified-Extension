[build-system]
requires = ["maturin>=1.8"]
build-backend = "maturin"

[project]
name = "poke-controller-modified-extension"
version = "0.1.0"
description = "Poke-Controller Modified Extension - Game console automation software with Rust core, Python scripting, camera capture, and MQTT notifications"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "yqYo1" }]
keywords = ["pokemon", "automation", "switch", "3ds", "controller"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
]
dependencies = [
  "gitpython>=3.1.45",
  "imagehash>=4.3.2",
  "numba>=0.61.2",
  "numpy>=2.2.6",
  "opencv-python>=4.12.0.88",
  "paho-mqtt>=2.1.0",
  "pandas>=2.3.1",
  "pillow>=11.3.0",
  "plyer>=2.1.0",
  # "pygame>=2.6.1",  # Requires SDL dev libs; install separately
  "pygubu>=0.38.2",
  "pynput>=1.8.1",
  "pyocr>=0.8.5",
  "pyserial>=3.5",
  "pythonnet>=3.0.5",
  "requests>=2.32.4",
  "scipy>=1.16.1",
  "setuptools>=80.9.0",
  "windows-capture-device-list>=1.1.0",
]

[project.optional-dependencies]
torch = [
  "torch>=2.8.0",
  "torchvision>=0.23.0",
]
keyboard = [
    "pykakasi>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
Repository = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"
Documentation = "https://github.com/yqYo1/Poke-Controller-Modified-Extension"

[dependency-groups]
dev = [
  "basedpyright>=1.31.4",
  "pytest>=8.4.0",
  "ruff>=0.12.12",
  "maturin>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.maturin]
python-packages = ["python/pokecon"]
module-name = "pokecon"
manifest-path = "rust/pokecon-pybindings/Cargo.toml"
